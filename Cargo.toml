[package]
name = "autoport"
version = "0.1.1"
edition = "2021"
description = "Dynamic SSH port forwarder with a TUI - VS Code-style auto port forwarding"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Havnevej/autoport"
documentation = "https://docs.rs/autoport"
keywords = ["ssh", "port-forward", "tui", "tunnel"]
categories = ["command-line-utilities", "development-tools", "network-programming"]

[dependencies]
ratatui = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
