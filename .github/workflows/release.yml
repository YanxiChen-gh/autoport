name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: autoport-linux-x86_64
          - target: aarch64-unknown-linux-musl
            package: autoport-linux-aarch64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Validate tag matches Cargo.toml version
        run: |
          version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "autoport") | .version')"
          if [ "$version" != "$cargo_version" ]; then
            echo "Release tag $RELEASE_TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Build release binary
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Package binary
        run: |
          package="${{ matrix.package }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/autoport" "dist/$package/autoport"
          chmod 0755 "dist/$package/autoport"
          cp README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-linux

    steps:
      - name: Checkout release notes source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="dist/release-notes.md"
          from_changelog=0

          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^## / {
                if (found) exit
                if ($0 ~ "^## \\[?" version "\\]?([[:space:]-]|$)") found = 1
              }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi

          if [ -s "$notes" ]; then
            from_changelog=1
          elif gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes" 2>/dev/null && [ -s "$notes" ]; then
            echo "Reusing existing release notes because no CHANGELOG.md entry exists for $RELEASE_TAG."
          else
            echo "CHANGELOG.md must contain a section for $RELEASE_TAG before release." >&2
            exit 1
          fi

          if [ "$from_changelog" = 1 ]; then
            cat >> "$notes" <<'EOF'

          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/Havnevej/autoport/main/install.sh | sh
          ```

          ## Downloads

          - `autoport-linux-x86_64.tar.gz` - Linux x86_64
          - `autoport-linux-aarch64.tar.gz` - Linux ARM64/aarch64
          - `SHA256SUMS` - SHA-256 checksums for the release assets

          ## Verify

          ```sh
          curl -LO https://github.com/Havnevej/autoport/releases/latest/download/SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          ```
          EOF
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "autoport $RELEASE_TAG" \
              --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "autoport $RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
