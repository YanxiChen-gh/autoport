name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: autoport-linux-x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            package: autoport-linux-aarch64
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            package: autoport-macos-x86_64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            package: autoport-macos-aarch64
            runner: macos-15

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Validate tag matches Cargo.toml version
        run: |
          version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "autoport") | .version')"
          if [ "$version" != "$cargo_version" ]; then
            echo "Release tag $RELEASE_TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: Exercise macOS binary and tests
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/autoport" --help
          cargo test --locked --target "$TARGET"
          python3 tests/ssh-smoke.py "target/$TARGET/release/autoport"

      - name: Package binary
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/$PACKAGE"
          cp "target/$TARGET/release/autoport" "dist/$PACKAGE/autoport"
          chmod 0755 "dist/$PACKAGE/autoport"
          cp README.md LICENSE "dist/$PACKAGE/"
          tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > dist/release-notes.md
          cat >> dist/release-notes.md <<'EOF'

          ## Install

          Linux and macOS (Intel or Apple Silicon):

          ```sh
          curl -fsSL https://raw.githubusercontent.com/YanxiChen-gh/autoport/main/install.sh | sh
          ```

          ## Downloads

          - `autoport-linux-x86_64.tar.gz` - Linux x86_64
          - `autoport-linux-aarch64.tar.gz` - Linux ARM64
          - `autoport-macos-x86_64.tar.gz` - macOS Intel
          - `autoport-macos-aarch64.tar.gz` - macOS Apple Silicon
          - `SHA256SUMS` - SHA-256 checksums
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "autoport $RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "autoport $RELEASE_TAG" --notes-file dist/release-notes.md \
              --draft --verify-tag
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
